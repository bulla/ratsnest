# Every pull request into develop, and every push to it (ADR 0020), on Bun alone: no Node is set
# up anywhere (ADR 0009). The tests and the compiled examples run on Linux, Windows and macOS, which
# a public repository runs for free. The last job, `ci`, passes only when every other has, and is the one check to require
# when protecting develop.
name: check

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint, typecheck and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The changelog check compares this branch with the one it goes into.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      - name: changelog
        # A change users get needs its entry under Unreleased (ADR 0017), unless the pull request
        # is labelled `no changelog`.
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no changelog')
        run: bun scripts/changelog.ts origin/${{ github.base_ref }}

  test:
    name: test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run test

  compiled:
    name: the examples, compiled, on ${{ matrix.os }}
    # A compiled ratsnest carries only what is imported, so the examples run with each system's
    # executable as a circuits project runs them, every page compared with the source's, and an
    # update put in place over itself, which Windows does its own way (ADR 0016, ADR 0020).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            executable: ratsnest-linux-x64
          - os: windows-latest
            target: windows-x64
            executable: ratsnest-windows-x64.exe
          - os: macos-latest
            target: darwin-arm64
            executable: ratsnest-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run build ${{ matrix.target }}

      - run: bun scripts/compiled.ts dist/${{ matrix.executable }}

  ci:
    name: ci
    if: always()
    needs: [lint, test, compiled]
    runs-on: ubuntu-latest
    steps:
      - name: every other job passed
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.compiled.result }}" = success
